[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bottle-vision"
version = "0.1.0"
description = "Segmentation-first bottle vision pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]
sam3 = [
  "Pillow>=10,<12",
  "torch>=2.7",
  "torchvision>=0.22",
  "huggingface_hub>=0.30",
  "sam3 @ git+https://github.com/facebookresearch/sam3.git",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
