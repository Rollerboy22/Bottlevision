project:
  name: bottle_vision
  version: 0.2.0

paths:
  dataset: dataset
  artifacts: artifacts
  logs: logs

segmentation:
  prompt: bottle
  preferred_model: sam3
  device: cuda
  checkpoint_path: null
  load_from_hf: true
  min_confidence: 0.50
  min_quality_score: 0.50
  min_area_ratio: 0.001
  max_area_ratio: 0.95
  fallback_models: []

quality:
  decision_policy: review_uncertain
  min_area_ratio: 0.001
  max_area_ratio: 0.95
  max_border_touch_ratio: 0.75

classification:
  classes_file: classes.json

training:
  split:
    train: 0.80
    val: 0.10
    test: 0.10
    group_by: group_id
